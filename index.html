<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NatMat</title>
  </head>
  <body>
    <div id="app">
      <div id="editor-pane">
        <div class="pane-header">
          <span>Italiano</span>
          <div class="toggle-buttons">
            <button id="provider-gemma" title="Usa Gemma (Gemini API)">Gemma</button>
            <button id="provider-groq" class="active" title="Usa Groq (llama-3.3-70b)">Groq</button>
            <div class="separator"></div>
            <button id="toggle-typst" class="active" title="Mostra/nascondi pannello Typst">Typst</button>
            <button id="toggle-preview" class="active" title="Mostra/nascondi anteprima">Preview</button>
          </div>
        </div>
        <div id="editor-inner"></div>
      </div>
      <div class="divider" id="divider-1"></div>
      <div id="output-pane">
        <div class="pane-header">
          <span>LaTeX</span>
          <span id="status"></span>
        </div>
        <div id="typst-editor"></div>
      </div>
      <div class="divider" id="divider-2"></div>
      <div id="preview-pane">
        <div class="pane-header">
          <span>Anteprima</span>
          <span id="preview-status"></span>
        </div>
        <div id="svg-container"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
